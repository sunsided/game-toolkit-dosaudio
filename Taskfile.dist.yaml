version: '3'
tasks:
  default:
    cmds: [task --list]
    silent: true
  build:
    desc: Build all examples and targets
    cmds:
      - cargo build --all-targets --locked {{.CLI_ARGS}}
  test:
    desc: Test chip backends, optional MIDI/PSG and the speaker-only build
    cmds:
      - cargo test --all-features --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features sb,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features gm,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features mt32,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features synthie --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features psg,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --locked {{.CLI_ARGS}}
  check:
    desc: Check formatting, feature combinations, docs and WebAssembly
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets --all-features --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features opl,formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features mt32,formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features synthie --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features gm,formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features psg,formats --locked -- -D warnings
      - task: docs
      - cargo check --lib --all-features --target wasm32-unknown-unknown --locked
  test:property:
    desc: Run generated MIDI, timing, capture and playback properties
    cmds:
      - cargo test --no-default-features --features opl,formats,mpu401 --test property --locked {{.CLI_ARGS}}
  test:mt32-roms:
    desc: Run explicit firmware-backed synthesis checks (ROMS=/path/to/rom-directory)
    requires:
      vars: [ROMS]
    env:
      DOSAUDIO_MT32_ROM_DIR: '{{.ROMS}}'
    cmds:
      - cargo test --no-default-features --features mt32 --test mt32 --locked -- --ignored
  fuzz:check:
    desc: Format and lint the separate fuzz workspace
    cmds:
      - cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
  fuzz:seeds:
    desc: Generate original parser and playback corpus seeds
    cmds:
      - python3 fuzz/seeds.py
  fuzz:smoke:
    desc: Run bounded sanitizer fuzz checks (requires nightly with rust-src and cargo-fuzz)
    cmds:
      - task: fuzz:seeds
      - for: [music_formats, opl_banks, playback, midi_uart]
        cmd: cargo +nightly fuzz run '{{.ITEM}}' -- -runs=256 -max_len=65536 -timeout=10 -rss_limit_mb=2048
  fuzz:run:
    desc: Fuzz one target (FUZZ_TARGET=music_formats|opl_banks|playback|midi_uart, FUZZ_SECONDS=60)
    vars:
      FUZZ_TARGET: '{{.FUZZ_TARGET | default "music_formats"}}'
      FUZZ_SECONDS: '{{.FUZZ_SECONDS | default "60"}}'
    cmds:
      - task: fuzz:seeds
      - cargo +nightly fuzz run '{{.FUZZ_TARGET}}' -- -max_total_time='{{.FUZZ_SECONDS}}' -max_len=65536 -timeout=10 -rss_limit_mb=2048 {{.CLI_ARGS}}
  docs:
    desc: Build documentation with warnings denied
    env:
      RUSTDOCFLAGS: '-D warnings'
    cmds:
      - cargo doc --all-features --no-deps --locked
  demo:
    desc: Play the AdLib demo through the audio device
    cmds:
      - task: demo:adlib
  demo:adlib:
    desc: Play the original AdLib phrase live
    cmds:
      - cargo run --no-default-features --features opl,toolkit --locked --example live_adlib
  demo:sb:
    desc: Render and play the Sound Blaster PCM tone
    cmds:
      - task: render:sb
      - task: play:wav
        vars:
          WAV: target/sb_pcm.wav
  demo:pcm:
    desc: Play a PCM buffer through the live Sound Blaster DSP
    cmds:
      - cargo run --no-default-features --features sb,toolkit --locked --example live_pcm
  render:adlib:
    desc: Render the original AdLib phrase to target/adlib.wav
    cmds:
      - cargo run --no-default-features --features opl --locked --example adlib -- target/adlib.wav
  render:sb:
    desc: Render the Sound Blaster PCM tone to target/sb_pcm.wav
    cmds:
      - cargo run --no-default-features --features sb --locked --example sb_pcm -- target/sb_pcm.wav
  render:pcm:
    desc: Render the buffered Sound Blaster chirp to target/pcm_buffer.wav
    cmds:
      - cargo run --no-default-features --features sb --locked --example pcm_buffer -- target/pcm_buffer.wav
  demo:opl-midi:
    desc: Hear MIDI on AdLib, dual OPL2 or OPL3 (CHIP=opl2|dual|opl3, optional MIDI=song.mid BANK=bank.op2|wopl|bnk|sbi)
    vars:
      CHIP: '{{.CHIP | default "opl2"}}'
    cmds:
      - task: render:opl-midi
        vars: {CHIP: '{{.CHIP}}', MIDI: '{{.MIDI}}', BANK: '{{.BANK}}'}
      - task: play:wav
        vars: {WAV: 'target/opl_midi_{{.CHIP}}.wav'}
  render:opl-midi:
    desc: Compile MIDI into OPL writes and render without playback (original song and starter bank unless MIDI/BANK are set)
    vars:
      CHIP: '{{.CHIP | default "opl2"}}'
    env:
      DOSAUDIO_DEMO_MIDI: '{{.MIDI}}'
      DOSAUDIO_DEMO_BANK: '{{.BANK}}'
    preconditions:
      - sh: '[ -z "$DOSAUDIO_DEMO_BANK" ] || [ -n "$DOSAUDIO_DEMO_MIDI" ]'
        msg: "BANK requires MIDI=/path/to/song.mid"
    cmds:
      # Task's shell splits quoted ${VAR:+"$VAR"} words, so build optional arguments explicitly.
      - |
        set -- '{{.CHIP}}' 'target/opl_midi_{{.CHIP}}.wav'
        if [ -n "$DOSAUDIO_DEMO_MIDI" ]; then set -- "$@" "$DOSAUDIO_DEMO_MIDI"; fi
        if [ -n "$DOSAUDIO_DEMO_BANK" ]; then set -- "$@" "$DOSAUDIO_DEMO_BANK"; fi
        cargo run --no-default-features --features opl,formats --locked --example opl_midi -- "$@"
  demo:file:
    desc: Hear your own DRO, IMF, VGM or MIDI file (FILE=path, ARG=IMF tick Hz or SF2 path for MIDI)
    requires:
      vars: [FILE]
    cmds:
      - task: render:file
        vars: {FILE: '{{.FILE}}', ARG: '{{.ARG}}'}
      - task: play:wav
        vars: {WAV: target/file.wav}
  render:file:
    desc: Render your own DRO, IMF, VGM or MIDI file to target/file.wav
    requires:
      vars: [FILE]
    env:
      DOSAUDIO_DEMO_FILE: '{{.FILE}}'
      DOSAUDIO_DEMO_ARG: '{{.ARG}}'
    cmds:
      - |
        set -- "$DOSAUDIO_DEMO_FILE" target/file.wav
        if [ -n "$DOSAUDIO_DEMO_ARG" ]; then set -- "$@" "$DOSAUDIO_DEMO_ARG"; fi
        cargo run --features psg,gm --locked --example render_file -- "$@"
  demo:opl-patches:
    desc: Hear six original OPL patches and five hardware rhythm drums
    cmds:
      - task: render:opl-patches
      - task: play:wav
        vars: {WAV: target/opl_patches.wav}
  render:opl-patches:
    desc: Render patch helpers and percussion without playback
    cmds:
      - cargo run --no-default-features --features opl,formats --locked --example opl_patches -- target/opl_patches.wav
  demo:mt32:
    desc: Hear CM-32L synthesis using your ROMs (ROMS=/path/to/rom-directory)
    requires:
      vars: [ROMS]
    cmds:
      - task: render:mt32
        vars: {ROMS: '{{.ROMS}}'}
      - task: play:wav
        vars: {WAV: target/mt32.wav}
  render:mt32:
    desc: Render MT-32 music with caller-supplied CM-32L control/PCM ROMs
    requires:
      vars: [ROMS]
    env:
      DOSAUDIO_DEMO_ROMS: '{{.ROMS}}'
    cmds:
      - cargo run --no-default-features --features mt32,formats --locked --example mt32 -- "$DOSAUDIO_DEMO_ROMS" target/mt32.wav
  demo:synthie:
    desc: Hear the same original song as native synthie, OPL and speaker
    cmds:
      - for: [native, opl, speaker]
        task: demo:synthie-output
        vars: {MODE: '{{.ITEM}}'}
  demo:synthie-output:
    desc: Hear one synthie arrangement (MODE=native|opl|speaker|switch)
    vars:
      MODE: '{{.MODE | default "native"}}'
    cmds:
      - task: render:synthie
        vars: {MODE: '{{.MODE}}'}
      - task: play:wav
        vars: {WAV: 'target/synthie_{{.MODE}}.wav'}
  demo:switch:
    desc: Hear native-to-OPL-to-speaker switching while the original song continues
    cmds:
      - task: demo:synthie-output
        vars: {MODE: switch}
  render:synthie:
    desc: Render a synthie arrangement or device switch without playback
    vars:
      MODE: '{{.MODE | default "switch"}}'
    cmds:
      - cargo run --no-default-features --features synthie --locked --example synthie_compare -- '{{.MODE}}' 'target/synthie_{{.MODE}}.wav'
  demo:music:
    desc: Play runtime FM replacement and volume fades live
    cmds:
      - cargo run --no-default-features --features opl,toolkit --locked --example live_music
  demo:model:
    desc: Render and play one Sound Blaster model (MODEL=sb1|sb2|pro|pro2|sb16)
    vars:
      MODEL: '{{.MODEL | default "sb16"}}'
    cmds:
      - task: render:model
        vars: {MODEL: '{{.MODEL}}'}
      - task: play:wav
        vars: {WAV: 'target/sb_{{.MODEL}}.wav'}
  demo:models:
    desc: Hear SB1, SB2, Pro, Pro2 and signed 16-bit stereo SB16 in order
    cmds:
      - for: [sb1, sb2, pro, pro2, sb16]
        task: demo:model
        vars: {MODEL: '{{.ITEM}}'}
  render:model:
    desc: Render a selected Sound Blaster model without playback
    vars:
      MODEL: '{{.MODEL | default "sb16"}}'
    cmds:
      - cargo run --no-default-features --features sb --locked --example sb_models -- '{{.MODEL}}' 'target/sb_{{.MODEL}}.wav'
  demo:dma:
    desc: Hear four mixed effects with memory-backed DMA and 40 IRQ refills
    cmds:
      - task: render:dma
      - task: play:wav
        vars: {WAV: target/dma_refill.wav}
  render:dma:
    desc: Render memory DMA and overlapping effects without playback
    cmds:
      - cargo run --no-default-features --features sb --locked --example dma_refill -- target/dma_refill.wav
  demo:speaker:
    desc: Hear an original QBasic PLAY phrase followed by PWM
    cmds:
      - task: render:speaker
      - task: play:wav
        vars: {WAV: target/speaker.wav}
  render:speaker:
    desc: Render PLAY and PWM without playback
    cmds:
      - cargo run --no-default-features --locked --example speaker -- target/speaker.wav
  demo:psg:
    desc: Hear a Tandy PSG arpeggio with noise percussion
    cmds:
      - task: render:psg
      - task: play:wav
        vars: {WAV: target/psg.wav}
  render:psg:
    desc: Render the PSG arpeggio without playback
    cmds:
      - cargo run --no-default-features --features psg --locked --example psg -- target/psg.wav
  demo:gm:
    desc: Hear an original MIDI phrase (SF2=/path/to/font.sf2)
    requires:
      vars: [SF2]
    cmds:
      - task: render:gm
        vars: {SF2: '{{.SF2}}'}
      - task: play:wav
        vars: {WAV: target/gm.wav}
  render:gm:
    desc: Render General MIDI using a caller-supplied SF2
    requires:
      vars: [SF2]
    env:
      DOSAUDIO_DEMO_SF2: '{{.SF2}}'
    cmds:
      - cargo run --no-default-features --features gm --locked --example gm -- "$DOSAUDIO_DEMO_SF2" target/gm.wav
  play:wav:
    internal: true
    env:
      DOSAUDIO_DEMO_WAV: '{{.WAV}}'
    cmds:
      - |
        if command -v ffplay >/dev/null 2>&1; then
          exec ffplay -nodisp -autoexit -loglevel error "$DOSAUDIO_DEMO_WAV"
        elif command -v afplay >/dev/null 2>&1; then
          exec afplay "$DOSAUDIO_DEMO_WAV"
        elif command -v pw-play >/dev/null 2>&1; then
          exec pw-play "$DOSAUDIO_DEMO_WAV"
        elif command -v paplay >/dev/null 2>&1; then
          exec paplay "$DOSAUDIO_DEMO_WAV"
        elif command -v aplay >/dev/null 2>&1; then
          exec aplay "$DOSAUDIO_DEMO_WAV"
        else
          echo 'Install ffplay, afplay, pw-play, paplay, or aplay to hear the WAV demo.' >&2
          exit 1
        fi
  ci:
    desc: Run checks, tests and package verification
    cmds:
      - task: check
      - task: test
      - cargo package --locked {{.CLI_ARGS}}
  publish:dry:
    desc: Package the crate and build it from the package, without uploading
    cmds:
      - cargo publish --dry-run --locked {{.CLI_ARGS}}
  release:
    desc: "Bump the version, stamp CHANGELOG.md, commit, tag and push (VERSION=x.y.z); CI publishes"
    requires:
      vars: [VERSION]
    preconditions:
      - sh: command -v cargo-release
        msg: "cargo-release not found - cargo install cargo-release --locked"
    prompt: "Release {{.VERSION}}: bump, commit, tag v{{.VERSION}} and push?"
    cmds:
      - cargo release {{.VERSION}} --execute --no-publish
