version: '3'
tasks:
  default:
    cmds: [task --list]
    silent: true
  build:
    desc: Build all examples and targets
    cmds:
      - cargo build --all-targets --locked {{.CLI_ARGS}}
  test:
    desc: Test chip backends, optional MIDI/PSG and the speaker-only build
    cmds:
      - cargo test --all-features --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features sb,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features gm,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --features psg,formats --locked {{.CLI_ARGS}}
      - cargo test --no-default-features --locked {{.CLI_ARGS}}
  check:
    desc: Check formatting, feature combinations, docs and WebAssembly
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets --all-features --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features opl,formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features gm,formats --locked -- -D warnings
      - cargo clippy --all-targets --no-default-features --features psg,formats --locked -- -D warnings
      - task: docs
      - cargo check --lib --all-features --target wasm32-unknown-unknown --locked
  docs:
    desc: Build documentation with warnings denied
    env:
      RUSTDOCFLAGS: '-D warnings'
    cmds:
      - cargo doc --all-features --no-deps --locked
  demo:
    desc: Play the AdLib demo through the audio device
    cmds:
      - task: demo:adlib
  demo:adlib:
    desc: Play the original AdLib phrase live
    cmds:
      - cargo run --no-default-features --features opl,toolkit --locked --example live_adlib
  demo:sb:
    desc: Render and play the Sound Blaster PCM tone
    cmds:
      - task: render:sb
      - task: play:wav
        vars:
          WAV: target/sb_pcm.wav
  demo:pcm:
    desc: Play a PCM buffer through the live Sound Blaster DSP
    cmds:
      - cargo run --no-default-features --features sb,toolkit --locked --example live_pcm
  render:adlib:
    desc: Render the original AdLib phrase to target/adlib.wav
    cmds:
      - cargo run --no-default-features --features opl --locked --example adlib -- target/adlib.wav
  render:sb:
    desc: Render the Sound Blaster PCM tone to target/sb_pcm.wav
    cmds:
      - cargo run --no-default-features --features sb --locked --example sb_pcm -- target/sb_pcm.wav
  render:pcm:
    desc: Render the buffered Sound Blaster chirp to target/pcm_buffer.wav
    cmds:
      - cargo run --no-default-features --features sb --locked --example pcm_buffer -- target/pcm_buffer.wav
  demo:opl-midi:
    desc: Hear original MIDI on AdLib, dual OPL2 or OPL3 (CHIP=opl2|dual|opl3)
    vars:
      CHIP: '{{.CHIP | default "opl2"}}'
    cmds:
      - task: render:opl-midi
        vars: {CHIP: '{{.CHIP}}'}
      - task: play:wav
        vars: {WAV: 'target/opl_midi_{{.CHIP}}.wav'}
  render:opl-midi:
    desc: Compile original MIDI into OPL writes and render without playback
    vars:
      CHIP: '{{.CHIP | default "opl2"}}'
    cmds:
      - cargo run --no-default-features --features opl,formats --locked --example opl_midi -- '{{.CHIP}}' 'target/opl_midi_{{.CHIP}}.wav'
  demo:opl-patches:
    desc: Hear six original OPL patches and five hardware rhythm drums
    cmds:
      - task: render:opl-patches
      - task: play:wav
        vars: {WAV: target/opl_patches.wav}
  render:opl-patches:
    desc: Render patch helpers and percussion without playback
    cmds:
      - cargo run --no-default-features --features opl,formats --locked --example opl_patches -- target/opl_patches.wav
  demo:music:
    desc: Play runtime FM replacement and volume fades live
    cmds:
      - cargo run --no-default-features --features opl,toolkit --locked --example live_music
  demo:model:
    desc: Render and play one Sound Blaster model (MODEL=sb1|sb2|pro|pro2|sb16)
    vars:
      MODEL: '{{.MODEL | default "sb16"}}'
    cmds:
      - task: render:model
        vars: {MODEL: '{{.MODEL}}'}
      - task: play:wav
        vars: {WAV: 'target/sb_{{.MODEL}}.wav'}
  demo:models:
    desc: Hear SB1, SB2, Pro, Pro2 and signed 16-bit stereo SB16 in order
    cmds:
      - for: [sb1, sb2, pro, pro2, sb16]
        task: demo:model
        vars: {MODEL: '{{.ITEM}}'}
  render:model:
    desc: Render a selected Sound Blaster model without playback
    vars:
      MODEL: '{{.MODEL | default "sb16"}}'
    cmds:
      - cargo run --no-default-features --features sb --locked --example sb_models -- '{{.MODEL}}' 'target/sb_{{.MODEL}}.wav'
  demo:dma:
    desc: Hear four mixed effects with memory-backed DMA and 40 IRQ refills
    cmds:
      - task: render:dma
      - task: play:wav
        vars: {WAV: target/dma_refill.wav}
  render:dma:
    desc: Render memory DMA and overlapping effects without playback
    cmds:
      - cargo run --no-default-features --features sb --locked --example dma_refill -- target/dma_refill.wav
  demo:speaker:
    desc: Hear an original QBasic PLAY phrase followed by PWM
    cmds:
      - task: render:speaker
      - task: play:wav
        vars: {WAV: target/speaker.wav}
  render:speaker:
    desc: Render PLAY and PWM without playback
    cmds:
      - cargo run --no-default-features --locked --example speaker -- target/speaker.wav
  demo:psg:
    desc: Hear a Tandy PSG arpeggio with noise percussion
    cmds:
      - task: render:psg
      - task: play:wav
        vars: {WAV: target/psg.wav}
  render:psg:
    desc: Render the PSG arpeggio without playback
    cmds:
      - cargo run --no-default-features --features psg --locked --example psg -- target/psg.wav
  demo:gm:
    desc: Hear an original MIDI phrase (SF2=/path/to/font.sf2)
    requires:
      vars: [SF2]
    cmds:
      - task: render:gm
        vars: {SF2: '{{.SF2}}'}
      - task: play:wav
        vars: {WAV: target/gm.wav}
  render:gm:
    desc: Render General MIDI using a caller-supplied SF2
    requires:
      vars: [SF2]
    env:
      DOSAUDIO_DEMO_SF2: '{{.SF2}}'
    cmds:
      - cargo run --no-default-features --features gm --locked --example gm -- "$DOSAUDIO_DEMO_SF2" target/gm.wav
  play:wav:
    internal: true
    env:
      DOSAUDIO_DEMO_WAV: '{{.WAV}}'
    cmds:
      - |
        if command -v ffplay >/dev/null 2>&1; then
          exec ffplay -nodisp -autoexit -loglevel error "$DOSAUDIO_DEMO_WAV"
        elif command -v afplay >/dev/null 2>&1; then
          exec afplay "$DOSAUDIO_DEMO_WAV"
        elif command -v pw-play >/dev/null 2>&1; then
          exec pw-play "$DOSAUDIO_DEMO_WAV"
        elif command -v paplay >/dev/null 2>&1; then
          exec paplay "$DOSAUDIO_DEMO_WAV"
        elif command -v aplay >/dev/null 2>&1; then
          exec aplay "$DOSAUDIO_DEMO_WAV"
        else
          echo 'Install ffplay, afplay, pw-play, paplay, or aplay to hear the WAV demo.' >&2
          exit 1
        fi
  ci:
    desc: Run checks, tests and package verification
    cmds:
      - task: check
      - task: test
      - cargo package --locked {{.CLI_ARGS}}
  publish:dry:
    desc: Package the crate and build it from the package, without uploading
    cmds:
      - cargo publish --dry-run --locked {{.CLI_ARGS}}
  release:
    desc: "Bump the version, stamp CHANGELOG.md, commit, tag and push (VERSION=x.y.z); CI publishes"
    requires:
      vars: [VERSION]
    preconditions:
      - sh: command -v cargo-release
        msg: "cargo-release not found - cargo install cargo-release --locked"
    prompt: "Release {{.VERSION}}: bump, commit, tag v{{.VERSION}} and push?"
    cmds:
      - cargo release {{.VERSION}} --execute --no-publish
