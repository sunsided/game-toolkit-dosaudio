name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, docs, package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolkit audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features formats --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features opl,formats --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features mt32,formats --locked -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features synthie --locked -- -D warnings
      - run: cargo test --no-default-features --features sb,formats --locked
      - run: cargo test --no-default-features --features gm,formats --locked
      - run: cargo test --no-default-features --features mt32,formats --locked
      - run: cargo test --no-default-features --features synthie --locked
      - run: cargo test --no-default-features --features psg,formats --locked
      - run: cargo test --all-features --locked
      - run: cargo test --all-features --release --locked
      - run: cargo test --no-default-features --locked
      - run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked

  wasm:
    name: WebAssembly with all features
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check --lib --all-features --target wasm32-unknown-unknown --locked

  msrv:
    name: Rust 1.95
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolkit audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95'
      - run: cargo check --all-targets --all-features --locked

  fuzz:
    name: Sanitizer fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-fuzz's locked dependencies do not build on current nightly; install it with stable.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src, rustfmt, clippy
      - run: cargo +stable install cargo-fuzz --version 0.13.1 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: python3 fuzz/seeds.py
      - name: Exercise all fuzz targets with AddressSanitizer and overflow checks
        run: |
          for fuzz_target in music_formats opl_banks playback midi_uart; do
            cargo +nightly fuzz run "$fuzz_target" -- -runs=256 -max_len=65536 -timeout=10 -rss_limit_mb=2048
          done
