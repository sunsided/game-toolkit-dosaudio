[package]
name = "game-toolkit-dosaudio"
version = "0.1.2"
edition = "2024"
autoexamples = false
rust-version = "1.95"
description = "Emulated DOS-era sound devices (PC speaker, Sound Blaster 2.0, AdLib OPL2/OPL3) on a shared hardware timeline"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
repository = "https://github.com/sunsided/game-toolkit-dosaudio"
homepage = "https://github.com/sunsided/game-toolkit-dosaudio"
documentation = "https://docs.rs/game-toolkit-dosaudio"
authors = ["Markus Mayer"]
readme = "README.md"
keywords = ["dos", "adlib", "sound-blaster", "opl", "pc-speaker"]
categories = ["emulators", "game-development", "multimedia::audio"]
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/THIRD-PARTY.md", "/LICENSE*"]

[package.metadata.release]
pre-release-replacements = [
  # Turn the pending notes into the release's section and open a fresh [Unreleased] above it.
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # Point [Unreleased] at the new tag and add a compare link for the release.
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/compare/(\\S+)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", exactly = 1 },
]

[features]
default = ["opl", "sb", "formats", "toolkit"]
opl = ["dep:oplon"]
sb = ["opl"]
mpu401 = []
gm = ["mpu401", "dep:rustysynth"]
psg = []
formats = ["dep:midly"]
toolkit = ["dep:game-toolkit-audio"]
nuked = ["opl", "dep:nuked-opl3"]

[dependencies]
game-toolkit-dosbus = "0.1"
rtrb = "0.4"
oplon = { version = "1.0", optional = true, default-features = false }
nuked-opl3 = { version = "0.1", optional = true }
game-toolkit-audio = { version = "0.11", optional = true }
rustysynth = { version = "1.3.8", optional = true }
midly = { version = "0.5.3", optional = true, default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
uninlined_format_args = "warn"

[dev-dependencies]
allocation-counter = "0.8"

[[example]]
name = "adlib"
required-features = ["opl"]

[[example]]
name = "live_adlib"
required-features = ["opl", "toolkit"]

[[example]]
name = "render_file"
required-features = ["opl", "formats"]

[[example]]
name = "sb_pcm"
required-features = ["sb"]

[[example]]
name = "pcm_buffer"
required-features = ["sb"]

[[example]]
name = "live_pcm"
required-features = ["sb", "toolkit"]

[[example]]
name = "sb_models"
required-features = ["sb"]

[[example]]
name = "live_music"
required-features = ["opl", "toolkit"]

[[example]]
name = "dma_refill"
required-features = ["sb"]

[[example]]
name = "psg"
required-features = ["psg"]

[[example]]
name = "speaker"

[[example]]
name = "gm"
required-features = ["gm"]
